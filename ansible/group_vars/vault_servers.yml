---
# Configuración específica de servidores Vault

# Versión de Vault
vault_version: "1.15.4"
vault_package_url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"

# Almacenamiento
vault_storage_backend: "file"
vault_storage_path: "/opt/vault/data"

# Red y puertos
vault_bind_addr: "0.0.0.0"
vault_api_addr: "http://{{ ansible_host }}:8200"
vault_cluster_addr: "0.0.0.0"
vault_cluster_listen_addr: "http://{{ ansible_host }}:8201"

# TLS (deshabilitado para desarrollo, habilitar en producción)
vault_tls_disable: "true"
vault_tls_cert_file: "/etc/vault.d/tls/vault.crt"
vault_tls_key_file: "/etc/vault.d/tls/vault.key"

# UI
vault_ui_enabled: "true"

# Inicialización (valores seguros por defecto)
vault_key_shares: 5
vault_key_threshold: 3

# AppRole (para CI/CD)
vault_approle_enabled: true
vault_approle_role_name: "iteria-ci-cd"

# Secrets Engine KV
vault_kv_version: 2
vault_secrets_path: "iteria"
vault_log_level: "info"