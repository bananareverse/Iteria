apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iteria-ingress
  namespace: iteria
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - iteria.local
    secretName: iteria-tls
  rules:
  - host: iteria.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iteria-frontend
            port:
              number: 80
